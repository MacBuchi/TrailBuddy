name: trailbuddy
description: "TrailBuddy — Mountainbike-Trails mit deinen Buddys teilen."
publish_to: 'none'

# Beide Teile erhöhen (z. B. 0.1.0+1 → 0.1.1+2). Ein Bump auf main taggt und
# baut ein Prerelease (release.yml); ohne Bump kein Release (Version Guard).
version: 0.10.0+14

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Karte (OpenStreetMap-Raster, kein API-Key). MapLibre für Android kommt
  # wie in PilzBuddy hinter einer Fassade — später, mit Messung.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  supabase_flutter: ^2.17.2
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  # GPX-Import: Dateiauswahl auf Android und Web, XML-Parser.
  file_selector: ^1.0.3
  xml: ^6.5.0
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - CHANGELOG.md
