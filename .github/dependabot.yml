# Abhängigkeits-Updates, gebündelt und monatlich (Muster PilzBuddy):
# `pubspec.yaml` ist nicht vom Version Guard ausgenommen, jeder pub-PR
# verlangt einen Bump und wird damit ein Release. Gebündelt bleibt es
# EIN PR im Monat. `.github/` ist ausgenommen; die Actions-PRs pflegen die
# SHA-Pins der Fremd-Actions.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      pub-dependencies:
        patterns: ["*"]
    ignore:
      # Riverpod 3 ist eine Migration, kein Update: der erste Sammel-PR (#8)
      # brach mit 21 Analyzer-Fehlern (Override-Typ, AsyncValue-API,
      # StateProvider). PilzBuddy steht ebenso auf 2.6.1. Umgestellt wird
      # bewusst, in einem eigenen PR und am besten in beiden Apps — sonst
      # hält ein einziges nicht anhebbares Paket den ganzen Sammel-PR rot,
      # und die brauchbaren Updates darin kämen nie durch.
      - dependency-name: "flutter_riverpod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "riverpod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

# Bewusst NICHT: "gradle" (Versionen kommen aus dem Flutter-SDK, AGP und
# Kotlin werden beim Flutter-Upgrade von Hand mitgezogen) und "pip" (die
# Skripte in tool/ brauchen keine Fremdpakete).
