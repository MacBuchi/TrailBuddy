name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    name: Tools & guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test of the trail matcher
        run: python3 tool/trail_match.py --self-test
      - name: Nothing private in the repository
        run: python3 tool/private_info_check.py
